# upsun.conf - how strider.sh reaches Upsun (and Platform.sh) apps.
#
# strider.sh loads this file by default. For another host, copy it, change what differs, and run
#   ./strider.sh -c myhost.conf
# The file is sourced by bash, so it holds plain variables plus the five functions at the end.

# Shown in the report ("Upsun project ...", "contact Upsun support").
PLATFORM_NAME="Upsun"

# Command that must be in PATH before a run starts, and how to log in if no projects come back.
PLATFORM_CLI="upsun"
LOGIN_HINT="upsun login"

# Logs inside the app container. They are copied into the report before anything else runs.
ACCESS_LOG="/var/log/access.log"           # web server access log, nginx/Apache combined format
PHP_ACCESS_LOG="/var/log/php.access.log"   # Upsun's PHP-FPM access log; leave empty if the host has none
ERROR_LOGS="/var/log/app.log /var/log/error.log /var/log/php.log"   # searched for crashes and memory errors
LOG_DIR="/var/log"                         # its listing is kept in container.txt for context

# The app's root inside the container: the environment variable that holds it, and a fallback.
APP_DIR_VAR="PLATFORM_APP_DIR"
APP_DIR_DEFAULT="/app"

# Where the hardening settings go, shown in the report's to-do box.
CONFIG_HINT=".upsun/config.yaml (or .platform.app.yaml)"

# Project IDs to scan when no -p is given, one per line.
platform_projects() { upsun project:list --pipe; }

# Default environment of project $1 (used when no -e is given).
platform_default_env() { upsun project:info -p "$1" default_branch; }

# Human-readable name of project $1, used as the report's heading.
platform_title() { upsun project:info -p "$1" title; }

# Apps in project $1, environment $2, one per line. Print nothing for a single-app project.
platform_apps() { upsun app:list -p "$1" -e "$2" --format plain --no-header --columns name; }

# Run shell command $4 in project $1, environment $2, app $3 (empty for a single-app project).
# stdin must pass through: strider.sh sends its in-container checks that way.
platform_ssh() { upsun ssh -p "$1" -e "$2" ${3:+-A "$3"} -- "$4"; }
