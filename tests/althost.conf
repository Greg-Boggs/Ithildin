# althost.conf - a made-up host for tests/run-tests.sh, to prove strider.sh takes everything
# host-specific from its config. Apps are docker containers named strider-test-<project>, reached
# with docker exec instead of the Upsun CLI, with logs and the app root in different places.

PLATFORM_NAME="Acme Hosting"
PLATFORM_CLI="docker"
LOGIN_HINT="docker login"

ACCESS_LOG="/srv/logs/access.log"
PHP_ACCESS_LOG=""
ERROR_LOGS="/srv/logs/php-errors.log"
LOG_DIR="/srv/logs"

APP_DIR_VAR="SITE_ROOT"
APP_DIR_DEFAULT="/srv/www"

CONFIG_HINT="the PHP settings in the Acme control panel"

platform_projects() { echo althost; }
platform_default_env() { echo live; }
platform_title() { echo "Acme test site"; }
platform_apps() { :; }
platform_ssh() { docker exec -i "strider-test-$1" sh -c "$4"; }
