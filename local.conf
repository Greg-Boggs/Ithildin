# local.conf - run strider.sh against log files on this machine instead of a hosted app.
#
#   cd folder-with-logs && /path/to/strider.sh -c /path/to/local.conf
#
# Put the logs you copied from the server in the current folder, or point STRIDER_LOG_DIR at them,
# using these names (Upsun's): access.log, php.access.log, app.log, error.log, php.log. Any that are
# missing are skipped.
#
# Inside a ddev container (ddev ssh) strider.sh also runs its in-container checks there: PHP
# version, sessions, files, processes and, with drush, Drupal accounts and modules. That's useful
# when the dev site runs on a copy of the production database. Anywhere else it reads the logs
# only, because scanning your workstation's processes and /tmp would only produce noise. Set
# CONTAINER_CHECKS=1 or 0 in the environment to override.

PLATFORM_NAME="Local"
PLATFORM_CLI="bash"
LOGIN_HINT="nothing to log in to; run from the folder holding the logs, or set STRIDER_LOG_DIR"

LOG_DIR=$(cd "${STRIDER_LOG_DIR:-.}" 2>/dev/null && pwd)
ACCESS_LOG="$LOG_DIR/access.log"
PHP_ACCESS_LOG="$LOG_DIR/php.access.log"
ERROR_LOGS="$LOG_DIR/app.log $LOG_DIR/error.log $LOG_DIR/php.log"

# ddev sets DDEV_APPROOT inside its web container.
APP_DIR_VAR="DDEV_APPROOT"
APP_DIR_DEFAULT="$PWD"

if [ -z "$CONTAINER_CHECKS" ]; then
  if [ -n "$DDEV_SITENAME" ]; then CONTAINER_CHECKS=1; else CONTAINER_CHECKS=0; fi
fi

CONFIG_HINT="the site's PHP settings (for ddev, .ddev/php/*.ini; on the server, its own config)"

SITE_NAME=${DDEV_SITENAME:-$(basename "$PWD")}
platform_projects() { echo "$SITE_NAME"; }
platform_default_env() { echo local; }
platform_title() { echo "$SITE_NAME"; }
platform_apps() { :; }
platform_ssh() { bash -c "$4"; }
